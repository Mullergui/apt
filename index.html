<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartamento Ciata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEED; --surface:#F9FAF9; --surface-2:#F1F3F2; --ink:#1F2429; --muted:#66707A;
  --line:#D2D7DA; --accent:#2B5BCF; --accent-soft:rgba(43,91,207,.12); --oak:#9A6A35;
  --danger:#BF3F2D; --danger-soft:rgba(191,63,45,.12); --ok:#2F7A53;
  --shadow:0 1px 2px rgba(20,25,30,.08),0 8px 24px rgba(20,25,30,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#13171A; --surface:#1B2024; --surface-2:#22282D; --ink:#E5E9EB; --muted:#98A2A9;
    --line:#2E363C; --accent:#7FA3FF; --accent-soft:rgba(127,163,255,.16); --oak:#C9965B;
    --danger:#F0806D; --danger-soft:rgba(240,128,109,.16); --ok:#6CC596;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13171A; --surface:#1B2024; --surface-2:#22282D; --ink:#E5E9EB; --muted:#98A2A9;
  --line:#2E363C; --accent:#7FA3FF; --accent-soft:rgba(127,163,255,.16); --oak:#C9965B;
  --danger:#F0806D; --danger-soft:rgba(240,128,109,.16); --ok:#6CC596;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px}
#stage{position:relative;overflow:hidden;touch-action:none;background:var(--paper)}
#stage canvas{display:block;width:100%;height:100%}
#labels,#overlay{position:absolute;inset:0;pointer-events:none}
#overlay{width:100%;height:100%}
.room-label{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;
  color:var(--ink);text-shadow:0 0 3px var(--surface),0 0 6px var(--surface)}
.room-label b{display:block;font-weight:600;font-size:13px;letter-spacing:.01em}
.room-label span{font-size:11px;color:var(--muted)}

/* barra superior */
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.bar>*{pointer-events:auto}
.title{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
.title h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
.title p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tools{display:flex;gap:6px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:500;box-shadow:var(--shadow)}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tool:disabled{opacity:.45;cursor:default}

.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none;max-width:calc(100% - 24px);text-align:center}
.status{position:absolute;left:12px;bottom:16px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;pointer-events:none}
.status.warn{color:var(--danger);border-color:var(--danger)}

/* joystick */
#joy{position:absolute;left:24px;bottom:64px;width:120px;height:120px;border-radius:50%;
  background:rgba(127,127,127,.18);border:1px solid rgba(127,127,127,.35);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow)}

/* painel */
#panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sheet-handle{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;border:0;background:none;padding:12px 6px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel-body{overflow:auto;flex:1;min-height:0;padding:12px 14px 20px}
.group-title{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.group-title:first-child{margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
  border:1px solid transparent;background:none;border-radius:9px;padding:7px 8px}
.row:hover{background:var(--surface-2)}
.row.sel{border-color:var(--accent);background:var(--accent-soft)}
.row .n{font-weight:500}
.row .d{font-size:12px;color:var(--muted);white-space:nowrap}
.row .bad{color:var(--danger)}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.row .l{display:flex;align-items:center;gap:8px;min-width:0}
.row .l .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* editor do item */
.editor{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface-2)}
.editor.bad{border-color:var(--danger)}
.editor h2{margin:0 0 2px;font-size:14px;font-weight:600}
.editor .msg{font-size:12px;color:var(--muted);margin:0 0 10px}
.editor .msg.bad{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13.5px;width:100%;min-width:0}
.field input[type=color]{padding:2px;height:33px}
.field.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.empty p{margin:0 0 10px;color:var(--muted)}
.opt{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.opt label{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;margin-bottom:10px}
input[type=range]{width:100%}

.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  .title{display:none}
  .bar{top:8px;left:8px;right:8px}
  .tool span{display:none}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:56%;height:56%;border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--shadow);transform:translateY(calc(100% - 52px - env(safe-area-inset-bottom,0px)));
    transition:transform .25s ease;z-index:4;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .sheet-handle{display:flex;align-items:center;justify-content:space-between;border:0;background:none;padding:10px 14px 4px;width:100%;font-weight:600}
  .sheet-handle small{color:var(--muted);font-weight:400}
  .hint{bottom:66px}
  .status{bottom:66px}
  #joy{bottom:84px}
}
@media (prefers-reduced-motion:reduce){ #panel,.toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="Visualização do apartamento">
    <div id="labels"></div>
    <svg id="overlay" aria-hidden="true"></svg>
    <div class="bar">
      <div class="title">
        <h1>Apartamento Ciata</h1>
        <p>32 m², projeto em modo de visualização</p>
      </div>
      <div class="seg" role="group" aria-label="Modo de visualização">
        <button data-mode="2d" aria-pressed="true">Planta</button>
        <button data-mode="3d" aria-pressed="false">3D</button>
        <button data-mode="walk" aria-pressed="false">Caminhar</button>
      </div>
      <div class="tools">
        <button class="tool" id="tMeasure" aria-pressed="false" title="Medir distância na planta">📏 <span>Medir</span></button>
        <button class="tool" id="tWalls" aria-pressed="true" title="Paredes baixas no 3D">▭ <span>Paredes baixas</span></button>
        <button class="tool" id="tUndo" title="Desfazer (Ctrl+Z)" disabled>↶ <span>Desfazer</span></button>
      </div>
    </div>
    <div id="joy" aria-hidden="true"><i></i></div>
    <div class="hint" id="hint"></div>
    <div class="status" id="status">Carregando…</div>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <aside id="panel" aria-label="Itens e ajustes">
    <button class="sheet-handle" id="sheetBtn" aria-expanded="false"><span id="sheetTitle">Itens</span><small>toque para abrir</small></button>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="items" aria-selected="true">Itens</button>
      
      <button role="tab" data-tab="settings" aria-selected="false">Ajustes</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

   ========================================================= */
const H = 2.50;          // pé-direito presumido
const WALLS = [];        // peças sólidas {x1,z1,x2,z2,y0,y1}
const WALL_RECTS = [];   // pegadas completas (para cotas)
const OPENINGS = [];     // portas e janelas

function addWall(x1,z1,x2,z2,openings){
  const horiz = (x2-x1) >= (z2-z1);
  WALL_RECTS.push({x1,z1,x2,z2});
  const L0 = horiz?x1:z1, L1 = horiz?x2:z2;
  const ops = (openings||[]).slice().sort((p,q)=>p.a-q.a);
  const seg=(a,b,y0,y1)=>{ if(b-a<1e-4||y1-y0<1e-4) return;
    WALLS.push(horiz?{x1:a,z1,x2:b,z2,y0,y1}:{x1,z1:a,x2,z2:b,y0,y1}); };
  let cur=L0;
  for(const o of ops){
    seg(cur,o.a,0,H); seg(o.a,o.b,0,o.y0); seg(o.a,o.b,o.y1,H); cur=o.b;
    OPENINGS.push(Object.assign({horiz, c0:horiz?z1:x1, c1:horiz?z2:x2}, o));
  }
  seg(cur,L1,0,H);
}
const E=0.15;
addWall(-E,-0.90,0,6.10);                                          // externa esquerda
addWall(0,-0.15,2.40,0,[{a:0.55,b:1.95,y0:0,y1:2.20,kind:'slide'}]); // sala | varanda
addWall(0,-0.90,0.24,-0.15);                                        // shaft da varanda
addWall(2.40,-0.90,2.52,3.87);                                      // sala | dormitório
addWall(2.52,0.73,4.92+E,0.85,[{a:2.95,b:3.95,y0:1.00,y1:2.20,kind:'window'}]); // externa do quarto
addWall(4.92,0.85,4.92+E,6.10);                                     // externa direita
addWall(0,5.95,4.92,5.95+E,[{a:1.05,b:1.87,y0:0,y1:2.10,kind:'door'}]); // externa inferior
addWall(2.52,3.75,4.92,3.87,[{a:2.70,b:3.42,y0:0,y1:2.10,kind:'door'}]); // dormitório | circulação

  {x1:0.24,z1:-0.86,x2:2.40,z2:-0.15,dry:false}
];
const ROOMS = [

  {name:'Cozinha',       x:1.20, z:4.30, dim:'',                            r:[0,3.0,3.55,5.95]},

  {name:'Banho',         x:4.05, z:4.45, dim:'1,25 × 2,10 m',               r:[3.67,3.87,4.92,5.95]},

function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function prng(seed){ let s=seed>>>0||7; return ()=>{ s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%100000)/100000; }; }
function tex(c, srgb){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=maxAniso; if(srgb) t.encoding=THREE.sRGBEncoding; return t; }

const PISOS = {

  cinza:{label:'Vinílico cinza nórdico', tones:['#A9A49B','#9E998F','#B3AEA5','#A39E95','#ADA89E']},
  espinha:{label:'Vinílico espinha de peixe mel escuro', herring:true, tones:['#8E5528','#985D2E','#834D24','#91592C','#9E6333','#7C4720','#93582A']},
  porcelanato:{label:'Porcelanato claro', tile:true}
};
const PLANK_W=1.22, PLANK_D=1.44;
function plankTexture(tones, seed){
  const W=1024, Hh=1208, rows=8, rh=Hh/rows, R=prng(seed);
  const c=makeCanvas(W,Hh), g=c.getContext('2d');
  for(let r=0;r<rows;r++){
    const y=r*rh, off=R()*W;
    const pieces=[[off-W,off],[off,off+W]];
    pieces.forEach(([a,b],pi)=>{
      g.fillStyle=tones[Math.floor(R()*tones.length)];
      g.fillRect(a,y,b-a,rh); g.fillRect(a+W,y,b-a,rh);
      // veios
      for(let k=0;k<34;k++){
        const yy=y+R()*rh, amp=1+R()*3, ph=R()*6, alpha=0.04+R()*0.10;
        g.strokeStyle= R()>0.5?`rgba(60,38,18,${alpha})`:`rgba(255,240,220,${alpha*0.7})`;
        g.lineWidth=0.6+R()*1.6; g.beginPath();
        for(let x=0;x<=W;x+=16){ const yv=yy+Math.sin(x/90+ph)*amp+Math.sin(x/23+ph*2)*0.6; x?g.lineTo(x,yv):g.moveTo(x,yv); }
        g.stroke();
      }
      if(R()>0.65){ const kx=a+R()*(b-a), ky=y+rh*0.3+R()*rh*0.4; g.fillStyle='rgba(70,45,20,.22)'; g.beginPath(); g.ellipse(((kx%W)+W)%W,ky,14,5,0,0,6.3); g.fill(); }
    });
    g.fillStyle='rgba(40,25,10,.45)';
    g.fillRect(((off%W)+W)%W,y,2,rh);
    g.fillRect(0,y,W,2);
  }
  return tex(c,true);
}
function tileTexture(seed){
  const S=512, R=prng(seed), c=makeCanvas(S,S), g=c.getContext('2d');
  const half=S/2;
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){
    const v=220+Math.floor(R()*10); g.fillStyle=`rgb(${v},${v-2},${v-6})`; g.fillRect(i*half,j*half,half,half);
  }
  for(let k=0;k<5000;k++){ const a=R()*0.06; g.fillStyle=R()>0.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`; g.fillRect(R()*S,R()*S,1.5,1.5); }
  g.fillStyle='#B8B4AC'; g.fillRect(0,0,S,3); g.fillRect(0,half-1.5,S,3); g.fillRect(0,0,3,S); g.fillRect(half-1.5,0,3,S);
  return tex(c,true);
}
function woodTexture(){
  const W=512, R=prng(91), c=makeCanvas(W,W), g=c.getContext('2d');
  g.fillStyle='#EDE3D6'; g.fillRect(0,0,W,W);
  for(let k=0;k<70;k++){ const yy=R()*W, amp=2+R()*5, ph=R()*6, a=0.05+R()*0.12;

function roundedBoxGeo(w,h,d,r){

  const v=new THREE.Vector3(), inn=new THREE.Vector3(), n=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.set(map(pos.getX(i),hf[0]),map(pos.getY(i),hf[1]),map(pos.getZ(i),hf[2]));
    inn.set(Math.max(-hf[0]+r,Math.min(hf[0]-r,v.x)),Math.max(-hf[1]+r,Math.min(hf[1]-r,v.y)),Math.max(-hf[2]+r,Math.min(hf[2]-r,v.z)));

}

/* =========================================================
   9. Itens na cena
   ========================================================= */
const itemRoot = new THREE.Group(); scene.add(itemRoot);
const itemGroups = new Map();
const selBox = new THREE.Box3Helper(new THREE.Box3(), new THREE.Color('#2B5BCF')); selBox.visible=false; scene.add(selBox);

function buildItem(it){
  const old=itemGroups.get(it.id); if(old){ itemRoot.remove(old); disposeGroup(old); }
  const g=new THREE.Group(); const fn=BUILD[it.kind]||BUILD.box;
  try{ fn(g,it); }catch(e){ console.error(e); BUILD.box(g,it); }
  g.userData.itemId=it.id; g.traverse(o=>{o.userData.itemId=it.id;});
  placeGroup(g,it); itemRoot.add(g); itemGroups.set(it.id,g); return g;
}
function disposeGroup(g){ g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
function placeGroup(g,it){ g.position.set(it.x,it.elev||0,it.z); g.rotation.y=(it.rot||0)*Math.PI/180; }
function wallRemoved(p){ const pa=(p.x2-p.x1)*(p.z2-p.z1); if(pa<=0) return false;
  return state.items.some(it=>{ if(it.kind!=='glasspartition') return false; const f=footprint(it);
    const ox=Math.min(f.x2,p.x2)-Math.max(f.x1,p.x1), oz=Math.min(f.z2,p.z2)-Math.max(f.z1,p.z1); return ox>0&&oz>0&&ox*oz>0.5*pa; }); }
function rebuildAll(){
  for(const [id,g] of itemGroups){ if(!state.items.find(i=>i.id===id)){ itemRoot.remove(g); disposeGroup(g); itemGroups.delete(id);} }
  state.items.forEach(buildItem); if(typeof applyWallHeight==='function') applyWallHeight();
}

/* pegada em planta (AABB) de um item */
function footprint(it){

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dimsTxt=it=>`${fmtCm(it.w)} × ${fmtCm(it.d)} × ${fmtCm(it.h)} cm`;

function editorHtml(it){
  const c=conflicts(it), ro=!canWrite;
  return `<div class="editor ${c.length?'bad':''}" id="editor">
    <h2>${esc(it.name)}</h2>
    <p class="msg ${c.length?'bad':''}" id="edMsg">${c.length?`Colide com ${esc([...new Set(c)].join(', '))}`:esc(roomOf(it))+(it.fixed?', ponto fixo da construtora':'')}</p>
    <div class="grid2">
      <label class="field full">Nome<input data-f="name" value="${esc(it.name)}" ${ro?'disabled':''}></label>
      <label class="field">Largura (cm)<input data-f="w" type="number" min="1" step="1" value="${fmtCm(it.w)}" ${ro?'disabled':''}></label>
      <label class="field">Profundidade (cm)<input data-f="d" type="number" min="1" step="1" value="${fmtCm(it.d)}" ${ro?'disabled':''}></label>
      <label class="field">Altura (cm)<input data-f="h" type="number" min="1" step="1" value="${fmtCm(it.h)}" ${ro?'disabled':''}></label>
      <label class="field">Altura do chão (cm)<input data-f="elev" type="number" min="0" step="1" value="${fmtCm(it.elev||0)}" ${ro?'disabled':''}></label>
      <label class="field">Rotação (°)<input data-f="rot" type="number" step="15" value="${Math.round(it.rot||0)}" ${ro?'disabled':''}></label>
      <label class="field">Cor<input data-f="color" type="color" value="${esc(it.color)}" ${ro?'disabled':''}></label>
      ${['cabinet','sink','peninsula','cookmodule'].includes(it.kind)?`<label class="field">Cor do tampo<input data-f="color2" type="color" value="${esc(it.color2||'#3A3C3E')}" ${ro?'disabled':''}></label>`:''}
    </div>
    ${ro?'':`<div class="actions">
      <button class="btn" data-a="rot">Girar 90°</button>
      <button class="btn" data-a="dup">Duplicar</button>
      <button class="btn" data-a="lock">${it.fixed?'Destravar':'Travar'}</button>
      <button class="btn danger" data-a="del">Excluir</button>
    </div>`}
  </div>`;
}
function refreshEditorLive(){
  const it=state.items.find(i=>i.id===selectedId); const ed=document.getElementById('editor'); if(!it||!ed) return;
  const c=conflicts(it); ed.classList.toggle('bad',!!c.length);
  const m=document.getElementById('edMsg'); m.classList.toggle('bad',!!c.length);
  m.textContent=c.length?`Colide com ${[...new Set(c)].join(', ')}`:roomOf(it)+(it.fixed?', ponto fixo da construtora':'');
}
function renderPanel(){
  let h='';
  const sel=selectedId && state.items.find(i=>i.id===selectedId);
  if(tab==='items'){
    if(sel) h+=editorHtml(sel);
    if(!state.items.length){
      h+= loaded ? `<div class="empty"><p>O projeto está vazio.</p>${canWrite?'<button class="btn primary" data-a="seed">Carregar meu projeto</button>':''}</div>`
                 : `<div class="empty"><p>Carregando o projeto…</p></div>`;
    } else {
      const groups={}; state.items.forEach(it=>{ (groups[roomOf(it)]=groups[roomOf(it)]||[]).push(it); });
      const order=ROOMS.map(r=>r.name).concat(['Fora dos ambientes']);
      order.forEach(r=>{ if(!groups[r]) return; h+=`<div class="group-title">${r}</div>`;
        groups[r].forEach(it=>{ const bad=conflicts(it).length;
          h+=`<button class="row ${it.id===selectedId?'sel':''}" data-sel="${it.id}"><span class="l"><span class="swatch" style="background:${esc(it.color)}"></span><span class="n">${esc(it.name)}${it.fixed?' 🔒':''}</span></span><span class="d ${bad?'bad':''}">${bad?'colisão':dimsTxt(it)}</span></button>`; }); });
    }
  } else if(tab==='add'){
    if(!canWrite) h+=`<p class="note">Somente o dono do projeto pode adicionar itens.</p>`;
    const cats=[...new Set(CATALOG.map(c=>c.cat))];
    cats.forEach(cat=>{ h+=`<div class="group-title">${cat}</div>`;
      CATALOG.forEach((c,i)=>{ if(c.cat!==cat) return; h+=`<button class="row" data-add="${i}" ${canWrite?'':'disabled'}><span class="l"><span class="swatch" style="background:${c.color}"></span><span class="n">${esc(c.name)}</span></span><span class="d">${fmtCm(c.w)} × ${fmtCm(c.d)} × ${fmtCm(c.h)}</span></button>`; }); });
    h+=`<p class="note">Para um produto específico, envie o print no chat com o canto desejado: as medidas da ficha técnica entram aqui automaticamente.</p>`;
  } else {
    h+=`<div class="opt"><label for="sPiso">Piso das áreas secas</label><div class="field"><select id="sPiso" ${canWrite?'':'disabled'}>${Object.entries(PISOS).map(([k,v])=>`<option value="${k}" ${state.piso===k?'selected':''}>${v.label}</option>`).join('')}</select></div></div>`;
    h+=`<div class="opt"><label for="sHora">Luz do sol: ${state.hora}h</label><input id="sHora" type="range" min="6" max="18" step="0.5" value="${state.hora}"></div>`;
    h+=`<label class="check"><input type="checkbox" id="sLabels" ${settings.labels?'checked':''}> Mostrar nomes e medidas dos ambientes na planta</label>`;
    h+=`<p class="note">Medidas lidas da planta comercial: sala e cozinha 2,40 × 5,95 m, dormitório 2,40 × 2,90 m, banho 1,25 × 2,10 m, varanda 2,16 × 0,71 m. Pé-direito presumido de 2,50 m e espessuras de parede de 12 a 15 cm. Posições de portas, janelas e pontos hidráulicos são aproximadas. Confirme tudo na vistoria antes de encomendar planejados.</p>`;
    h+=`<p class="note">${storageMode==='db'?'O projeto é salvo na sua conta e sincroniza entre dispositivos.':storageMode==='local'?'O projeto está salvo só neste navegador.':''}</p>`;
  }
  body.innerHTML=h;
}
body.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.sel){ select(t.dataset.sel); if(mode==='2d'){ const it=state.items.find(i=>i.id===t.dataset.sel); if(it){ortho.fit=false;ortho.cx=it.x;ortho.cz=it.z;placeOrtho();} } return; }
  if(t.dataset.add!=null){ addFromCatalog(CATALOG[+t.dataset.add]); return; }
  const it=selectedId && state.items.find(i=>i.id===selectedId);
  switch(t.dataset.a){
    case 'rot': if(it) rotateItem(it,90); break;
    case 'dup': if(it) duplicateItem(it); break;
    case 'lock': if(it){ pushHistory(clone(state)); it.fixed=!it.fixed; renderPanel(); commit(); } break;
    case 'del': if(it) removeItem(it.id); break;
    case 'seed': if(state.items.length && !confirm('Substituir o mobiliário atual pelo seu projeto salvo?')) return;
      pushHistory(clone(state)); state.items=PLAN_LAYOUT.map(p=>Object.assign({id:uid(),elev:0},clone(p))); selectedId=null; rebuildAll(); updateSelBox(); renderPanel(); commit(); toast('Projeto carregado'); break;
  }
});
body.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='sPiso'){ pushHistory(clone(state)); state.piso=t.value; applyFloors(); commit(); return; }
  if(t.id==='sLabels'){ settings.labels=t.checked; return; }
  if(t.id==='sHora'){ state.hora=+t.value; placeSun(); renderPanel(); commit(); return; }
  const f=t.dataset.f; const it=selectedId && state.items.find(i=>i.id===selectedId); if(!f||!it||!canWrite) return;
  pushHistory(clone(state));
  if(f==='name') it.name=t.value.trim()||it.name;
  else if(f==='color') it.color=t.value;
  else if(f==='color2') it.color2=t.value;
  else if(f==='rot') it.rot=((+t.value||0)%360);
  else { const v=Math.max(f==='elev'?0:1,+t.value||0)/100; it[f]=v; }
  buildItem(it); updateSelBox(); renderPanel(); commit();
});
body.addEventListener('input',e=>{ if(e.target.id==='sHora'){ state.hora=+e.target.value; placeSun(); const l=e.target.previousElementSibling; if(l) l.textContent=`Luz do sol: ${state.hora}h`; } });

/* folha inferior no celular */
const panelEl=document.getElementById('panel'), sheetBtn=document.getElementById('sheetBtn');
function openSheet(v){ panelEl.classList.toggle('open',v); sheetBtn.setAttribute('aria-expanded',String(v)); sheetBtn.querySelector('small').textContent=v?'toque para fechar':'toque para abrir'; }
sheetBtn.addEventListener('click',()=>openSheet(!panelEl.classList.contains('open')));

/* barra superior */
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('tMeasure').addEventListener('click',e=>{ measure={on:!measure.on,a:null,b:null,hover:null}; e.currentTarget.setAttribute('aria-pressed',String(measure.on)); if(measure.on){ select(null); toast('Clique em dois pontos da planta'); } });
document.getElementById('tWalls').addEventListener('click',e=>{ wallsLow=!wallsLow; e.currentTarget.setAttribute('aria-pressed',String(wallsLow)); applyWallHeight(); });
document.getElementById('tUndo').addEventListener('click',undo);

let toastT=null; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
const statusEl=document.getElementById('status');
function setStatus(txt,warn){ statusEl.textContent=txt; statusEl.classList.toggle('warn',!!warn); statusEl.style.display=txt?'':'none'; }

/* =========================================================
   15. Persistência
   ========================================================= */
const LS_KEY='apartamento-ciata-v1';
let saveT=null, saving=false, saveAgain=false;
function commit(){ blockers=null; applyWallHeight(); renderPanelSoft(); clearTimeout(saveT); saveT=setTimeout(save,500); }
function renderPanelSoft(){ if(tab==='items' && !document.activeElement?.closest('#editor')) renderPanel(); }
async function save(){
  const data={items:state.items, piso:state.piso, hora:state.hora, updatedAt:Date.now()};
  if(storageMode==='db' && layoutRef && canWrite){
    if(!loaded) return;
    if(saving){ saveAgain=true; return; }
    saving=true; setStatus('Salvando…');
    try{ await layoutRef.set(data); setStatus('Salvo'); setTimeout(()=>{ if(statusEl.textContent==='Salvo') setStatus(''); },1500); }
    catch(err){ if(err&&err.code==='invalid_argument'){ canWrite=false; renderPanel(); setStatus('Somente leitura',true); } else setStatus('Não foi possível salvar. Tente de novo em instantes.',true); }
    saving=false; if(saveAgain){ saveAgain=false; save(); }
  } else if(storageMode==='local'){
    try{ localStorage.setItem(LS_KEY,JSON.stringify(data)); }catch(e){}
  }
}
function applyRemote(d){
  if(drag) return;
  const next={items:Array.isArray(d.items)?d.items:[], piso:PISOS[d.piso]?d.piso:'carvalho', hora:typeof d.hora==='number'?d.hora:10};
  next.items.forEach(it=>{ if(!it.id) it.id=uid(); it.elev=it.elev||0; it.rot=it.rot||0; });
  if(JSON.stringify(next)===JSON.stringify(state)) return;
  state=next; history.length=0; document.getElementById('tUndo').disabled=true; rebuildAll(); applyFloors(); placeSun();
  if(selectedId && !state.items.find(i=>i.id===selectedId)) selectedId=null;
  updateSelBox(); renderPanel(); blockers=null;
}
function loadLocal(){
  storageMode='local';
  let d=null; try{ d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(!d) d={items:PLAN_LAYOUT.map(p=>Object.assign({id:uid(),elev:0},clone(p))),piso:'espinha',hora:10};
  loaded=true; applyRemote(d); renderPanel(); setStatus('');
}
async function initPersistence(){
  if(!window.claude || typeof window.claude.use!=='function'){ loadLocal(); return; }
  let dbNs=null, userNs=null;
  try{ [dbNs,userNs]=await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
  if(!dbNs){ loadLocal(); return; }
  storageMode='db';
  try{ canWrite = userNs ? await userNs.isOwner() : true; }catch(e){ canWrite=true; }
  document.getElementById('tUndo').disabled=true;
  layoutRef=dbNs.doc('projeto/layout');
  let timer=setTimeout(()=>setStatus('Não foi possível carregar o projeto salvo ainda.',true),10000);
  let first=true;
  layoutRef.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); }
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists){ loaded=true; applyRemote(snap.data()); }
    else if(!snap.metadata.fromCache){ loaded=true; renderPanel(); }
    if(statusEl.textContent==='Carregando…' && loaded) setStatus('');
    if(!canWrite) setStatus('Somente leitura');
    if(first && loaded){ first=false; setMode(mode); }
  }, err=>{ clearTimeout(timer); setStatus('O projeto salvo não está disponível agora.',true); if(!loaded) loadLocal(); });
}

/* =========================================================
   16. Loop e redimensionamento
   ========================================================= */
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false);
  camPersp.aspect=w/h; camPersp.updateProjectionMatrix();
  camWalk.aspect=w/h; camWalk.updateProjectionMatrix();
  placeOrtho();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>setMode(mode));

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(mode==='walk') stepWalk(dt);
  if(mode==='3d') orbit.update();
  renderer.render(scene,activeCam());
  updateOverlay();
  requestAnimationFrame(loop);
}

applyFloors(); placeSun(); renderPanel(); setMode('2d'); resize();
camWalk.position.set(walk.x,1.6,walk.z);
requestAnimationFrame(loop);
(function viewOnly(){ // versão de visualização: nada é movido nem salvo
  storageMode="none"; canWrite=false; loaded=true;
  state={items:PLAN_LAYOUT.map(p=>Object.assign({id:uid(),elev:0},clone(p))), piso:"espinha", hora:10};
  rebuildAll(); applyFloors(); placeSun(); updateSelBox(); renderPanel(); setStatus(""); setMode(mode);
  document.getElementById("tUndo").style.display="none";
})();
})();
</script>
